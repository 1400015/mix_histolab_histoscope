name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Web (lint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:js
      - run: npm run build

  engine:
    name: Motor local (pytest + avaliação)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r engine/requirements.txt pytest
      # PR: conjunto rápido (sem os testes de galeria, ~3 s) — a regressão do
      # classificador fica garantida pelo eval.py abaixo. Push: suite completa.
      - run: python -m pytest -q engine/ -m "not gallery"
        if: github.event_name == 'pull_request'
      - run: python -m pytest -q engine/
        if: github.event_name == 'push'
      # Report informativo de precisão (não bloqueia — ver docs/alteracoes.md)
      - run: python engine/eval.py
